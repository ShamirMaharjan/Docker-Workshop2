services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - mern-net
    volumes:
      - mongo-data:/data/db

  server:
    image: shamirmaharjan/mern-server:latest
    build:
      context: ./server
    container_name: mern-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    networks:
      - mern-net

  client:
    image: shamirmaharjan/mern-client:latest
    build:
      context: ./client
    container_name: mern-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    depends_on:
      - server
    networks:
      - mern-net

networks:
  mern-net:

volumes:
  mongo-data: